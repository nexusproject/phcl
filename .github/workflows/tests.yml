name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install uv
        run: pip install uv

      - name: install deps
        run: uv sync --dev

      - name: run tests
        run: uv run pytest --cov=phcl --cov-report=xml

      - name: upload coverage
        uses: codecov/codecov-action@v4
